name: Selenium Automation Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start Selenium Grid
        run: |
          docker run -d \
            --name selenium-grid \
            -p 4444:4444 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/eso1907a.jpg,target=$GITHUB_WORKSPACE/eso1907a.jpg,readonly" \
            --shm-size=2g \
            selenium/standalone-chrome:4.54.0-20261123

      - name: Wait for Selenium Grid
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4444/status | jq -e '.value.ready == true'; then
              exit 0
            fi
            sleep 2
          done
          docker logs selenium-grid
          exit 1

      - name: Execute TestNG tests
        # Explicit selection bypasses the suite's incorrect packages and unsafe parallelism.
        run: mvn -B clean test -Dtest=testPackage.TestClass -DfailIfNoTests=true
        env:
          SELENIUM_GRID_URL: http://localhost:4444

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TestNG-Reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Print Selenium logs on failure
        if: failure()
        run: docker logs selenium-grid || true

      - name: Stop Selenium Grid
        if: always()
        run: docker rm -f selenium-grid || true
